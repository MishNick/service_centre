<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервисный центр{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Навигационная панель -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- Логотип и название -->
                <div class="flex items-center">
                    <a href="/" class="text-xl font-semibold text-gray-800">Сервисный центр</a>
                </div>

                <!-- Меню (будет заполняться в дочерних шаблонах) -->
                <div class="flex items-center space-x-4">
                    {% block menu %}{% endblock %}

                    <!-- Кнопка выхода -->
                    <a href="/auth/logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm">
                        Выйти
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto py-6 px-4">
        <!-- Блок для сообщений -->
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-4 rounded {% if message.type == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                {{ message.text }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
