<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Сервисный центр</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold mb-2 text-center">Вход</h1>
            <p class="text-gray-600 mb-4 text-center">
                Введите номер телефона для входа
            </p>

            <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 hidden"></div>

            <form id="login-form" onsubmit="requestCode(event)">
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">
                        Номер телефона
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="phone"
                        type="text"
                        placeholder="+79991234567"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full"
                    type="submit"
                    id="submit-btn"
                >
                    Получить код
                </button>
            </form>
        </div>
    </div>

    <script>
        async function requestCode(event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            errorDiv.classList.add('hidden');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const response = await fetch('/auth/request-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = `/auth/verify?phone=${encodeURIComponent(phone)}`;
                } else {
                    showError(data.detail || 'Ошибка при отправке кода');
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Получить код';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
