<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Сервисный центр</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold mb-2 text-center">Подтверждение</h1>
            <p class="text-gray-600 mb-4 text-center">
                Код отправлен на номер<br>
                <strong>{{ phone }}</strong>
            </p>

            <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 hidden"></div>

            <form id="verify-form" onsubmit="verifyCode(event)">
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="code">
                        Введите код из СМС
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-center text-2xl tracking-widest"
                        id="code"
                        type="text"
                        maxlength="4"
                        placeholder="1234"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="flex items-center justify-between">
                    <button
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
                        type="submit"
                        id="submit-btn"
                    >
                        Подтвердить
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <button onclick="resendCode()" class="text-blue-600 hover:text-blue-800 text-sm">
                    Отправить код повторно
                </button>
            </div>

            <div class="text-center mt-4">
                <a href="/auth/login" class="text-gray-500 hover:text-gray-700 text-sm">
                    ← Назад
                </a>
            </div>

            <!-- Для отладки: показываем код (уберем в продакшне) -->
            <div class="mt-6 p-3 bg-yellow-50 border border-yellow-200 rounded text-center">
                <p class="text-xs text-yellow-700 mb-1">🛠️ Режим отладки</p>
                <p class="text-sm font-mono" id="debug-code">Код появится после запроса</p>
            </div>
        </div>
    </div>

    <script>
        const phone = new URLSearchParams(window.location.search).get('phone');

        async function verifyCode(event) {
            event.preventDefault();

            const code = document.getElementById('code').value;
            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            if (code.length !== 4 || !/^\d+$/.test(code)) {
                showError('Введите 4 цифры');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Проверка...';
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/auth/verify-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: phone,
                        code: code
                    })
                });

                if (response.ok) {
                    // Успех - сервер сам сделает редирект с установкой cookie
                    window.location.href = response.url;
                } else {
                    const data = await response.json();
                    showError(data.detail || 'Неверный код');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Подтвердить';
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Подтвердить';
            }
        }

        async function resendCode() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const response = await fetch('/auth/request-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phone: phone })
                });

                if (response.ok) {
                    alert('Код отправлен повторно');
                    setTimeout(updateDebugCode, 1000);
                } else {
                    alert('Ошибка при отправке');
                }
            } catch (error) {
                alert('Ошибка соединения');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить код повторно';
            }
        }

        function updateDebugCode() {
            const debugEl = document.getElementById('debug-code');
            if (debugEl) {
                debugEl.textContent = '✅ Код отправлен (смотри в консоль/терминал)';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        document.getElementById('code').focus();
    </script>
</body>
</html>
