{% extends "base.html" %}

{% block title %}Панель диспетчера{% endblock %}

{% block menu %}
    <span class="text-gray-600">Диспетчер: {{ user.name }}</span>
    <a href="/dispatcher/dashboard" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm">
        📋 Активные
    </a>
    <a href="/dispatcher/archive" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">
        📦 Архив
    </a>
    <a href="/dispatcher/tasks/create" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm">
        + Новая задача
    </a>
{% endblock %}

{% block content %}
<div class="bg-white shadow rounded-lg p-6">
    <h1 class="text-2xl font-bold mb-6">Все задачи</h1>

    <div class="mb-6 p-4 bg-gray-50 rounded-lg">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">🔍 Поиск</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="ID, клиент, оборудование..."
                    class="w-full border rounded px-3 py-2"
                    oninput="filterTasks()"
                >
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📊 Статус</label>
                <select
                    id="statusFilter"
                    class="w-full border rounded px-3 py-2"
                    onchange="filterTasks()"
                >
                    <option value="">Все статусы</option>
                    <option value="new">🆕 Новые</option>
                    <option value="assigned">👤 Назначены</option>
                    <option value="in_progress">⚙️ В работе</option>
                    <option value="waiting_for_part">⏳ Ждут детали</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">👨‍🔧 Инженер</label>
                <select
                    id="engineerFilter"
                    class="w-full border rounded px-3 py-2"
                    onchange="filterTasks()"
                >
                    <option value="">Все инженеры</option>
                    {% for engineer in engineers %}
                    <option value="{{ engineer.id }}">{{ engineer.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-end">
                <button
                    onclick="resetFilters()"
                    class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded w-full"
                >
                    🗑️ Сбросить фильтры
                </button>
            </div>
        </div>

        <div class="mt-3 text-sm text-gray-500" id="filterStats"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="statsContainer"></div>

    <div class="overflow-x-auto">
        <table class="min-w-full bg-white">
            <thead>
                <tr class="bg-gray-100 text-gray-600 uppercase text-sm leading-normal">
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('id')">
                        ID <span id="sort-id"></span>
                    </th>
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('client')">
                        Клиент <span id="sort-client"></span>
                    </th>
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('phone')">
                        Телефон <span id="sort-phone"></span>
                    </th>
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('address')">
                        Адрес <span id="sort-address"></span>
                    </th>
                    <th class="py-3 px-6 text-left">Оборудование</th>
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('engineer')">
                        Инженер <span id="sort-engineer"></span>
                    </th>
                    <th class="py-3 px-6 text-left">Статус</th>
                    <th class="py-3 px-6 text-left cursor-pointer hover:bg-gray-200" onclick="sortBy('date')">
                        Дата <span id="sort-date"></span>
                    </th>
                    <th class="py-3 px-6 text-left">Действия</th>
                </tr>
            </thead>
            <tbody id="tasksTableBody" class="text-gray-600 text-sm">
            </tbody>
        </table>
    </div>
</div>

<script>
    const allTasks = {{ tasks_json | default([], true) | tojson | safe }};
    const allEngineers = {{ engineers_json | default([], true) | tojson | safe }};
    let currentSort = { field: 'id', direction: 'desc' };

    function renderStats(filteredTasks) {
        const stats = {
            new: filteredTasks.filter(t => t.status === 'new').length,
            assigned: filteredTasks.filter(t => t.status === 'assigned').length,
            in_progress: filteredTasks.filter(t => t.status === 'in_progress').length,
            waiting_for_part: filteredTasks.filter(t => t.status === 'waiting_for_part').length
        };

        const statsHtml = `
            <div class="bg-gray-50 p-4 rounded border">
                <h3 class="font-semibold text-gray-700">Новые</h3>
                <p class="text-2xl">${stats.new}</p>
            </div>
            <div class="bg-yellow-50 p-4 rounded border border-yellow-200">
                <h3 class="font-semibold text-yellow-800">Назначены</h3>
                <p class="text-2xl">${stats.assigned}</p>
            </div>
            <div class="bg-blue-50 p-4 rounded border border-blue-200">
                <h3 class="font-semibold text-blue-800">В работе</h3>
                <p class="text-2xl">${stats.in_progress}</p>
            </div>
            <div class="bg-purple-50 p-4 rounded border border-purple-200">
                <h3 class="font-semibold text-purple-800">Ждут детали</h3>
                <p class="text-2xl">${stats.waiting_for_part}</p>
            </div>
        `;

        document.getElementById('statsContainer').innerHTML = statsHtml;
    }

    function filterTasks() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        const engineerFilter = document.getElementById('engineerFilter').value;

        let filtered = allTasks.filter(task => {
            if (searchTerm) {
                const searchable = `
                    ${task.id || ''}
                    ${task.client_name || task.client?.name || ''}
                    ${task.equipment_type || ''}
                    ${task.equipment_model || ''}
                `.toLowerCase();

                if (!searchable.includes(searchTerm)) {
                    return false;
                }
            }

            if (statusFilter && task.status !== statusFilter) {
                return false;
            }

            if (engineerFilter && task.engineer_id !== parseInt(engineerFilter)) {
                return false;
            }

            return true;
        });

        filtered.sort((a, b) => {
            let aVal;
            let bVal;

            switch (currentSort.field) {
                case 'id':
                    aVal = a.id || 0;
                    bVal = b.id || 0;
                    break;
                case 'client':
                    aVal = (a.client_name || a.client?.name || '').toLowerCase();
                    bVal = (b.client_name || b.client?.name || '').toLowerCase();
                    break;
                case 'phone':
                    aVal = a.client_phone || a.client?.phone || '';
                    bVal = b.client_phone || b.client?.phone || '';
                    break;
                case 'address':
                    aVal = (a.client_address || a.client?.address || '').toLowerCase();
                    bVal = (b.client_address || b.client?.address || '').toLowerCase();
                    break;
                case 'engineer':
                    aVal = (a.engineer?.name || 'Не назначен').toLowerCase();
                    bVal = (b.engineer?.name || 'Не назначен').toLowerCase();
                    break;
                case 'date':
                    aVal = a.created_at ? new Date(a.created_at).getTime() : 0;
                    bVal = b.created_at ? new Date(b.created_at).getTime() : 0;
                    break;
                default:
                    aVal = a.id || 0;
                    bVal = b.id || 0;
            }

            if (aVal < bVal) {
                return currentSort.direction === 'asc' ? -1 : 1;
            }
            if (aVal > bVal) {
                return currentSort.direction === 'asc' ? 1 : -1;
            }
            return 0;
        });

        renderTasks(filtered);
        renderStats(filtered);

        document.getElementById('filterStats').innerHTML =
            `Найдено: ${filtered.length} из ${allTasks.length} задач`;
    }

    function renderTasks(tasks) {
        const tbody = document.getElementById('tasksTableBody');

        if (!tasks.length) {
            tbody.innerHTML =
                '<tr><td colspan="9" class="py-8 text-center text-gray-500">Нет задач</td></tr>';
            return;
        }

        tbody.innerHTML = tasks.map(task => {
            const engineerName = task.engineer?.name || 'Не назначен';
            const createdAt = task.created_at
                ? new Date(task.created_at).toLocaleDateString()
                : '-';

            return `
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-6">#${task.id ?? '-'}</td>
                    <td class="py-3 px-6">${escapeHtml(task.client_name || task.client?.name || '-')}</td>
                    <td class="py-3 px-6">${escapeHtml(task.client_phone || task.client?.phone || '-')}</td>
                    <td class="py-3 px-6">
                        ${escapeHtml((task.client_address || task.client?.address || '').substring(0, 40))}
                        ${(task.client_address || task.client?.address || '').length > 40 ? '...' : ''}
                    </td>
                    <td class="py-3 px-6">
                        ${escapeHtml(task.equipment_type || '')} ${escapeHtml(task.equipment_model || '')}
                    </td>
                    <td class="py-3 px-6">${escapeHtml(engineerName)}</td>
                    <td class="py-3 px-6">
                        <span class="px-2 py-1 rounded-full text-xs
                            ${task.status === 'new' ? 'bg-gray-200 text-gray-800' : ''}
                            ${task.status === 'assigned' ? 'bg-yellow-100 text-yellow-800' : ''}
                            ${task.status === 'in_progress' ? 'bg-blue-100 text-blue-800' : ''}
                            ${task.status === 'waiting_for_part' ? 'bg-purple-100 text-purple-800' : ''}
                            ${task.status === 'completed' ? 'bg-green-100 text-green-800' : ''}">
                            ${escapeHtml(task.status || '-')}
                        </span>
                    </td>
                    <td class="py-3 px-6">${createdAt}</td>
                    <td class="py-3 px-6">
                        ${task.status === 'completed'
                            ? `<a href="/api/tasks/${task.id}/generate-act" target="_blank" class="text-blue-600 hover:text-blue-800 text-sm font-medium">📄 Акт</a>`
                            : `<select onchange="assignEngineer(${task.id}, this.value)" class="border rounded text-xs p-1">
                                <option value="">Назначить...</option>
                                ${allEngineers.map(e => `
                                    <option value="${e.id}" ${task.engineer_id === e.id ? 'selected' : ''}>
                                        ${e.name}
                                    </option>
                                `).join('')}
                            </select>`
                        }
                    </td>
                </tr>
            `;
        }).join('');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function sortBy(field) {
        if (currentSort.field === field) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.field = field;
            currentSort.direction = 'asc';
        }

        ['id', 'client', 'phone', 'address', 'engineer', 'date'].forEach(f => {
            const span = document.getElementById(`sort-${f}`);
            if (span) {
                span.innerHTML = '';
            }
        });

        const span = document.getElementById(`sort-${field}`);
        if (span) {
            span.innerHTML = currentSort.direction === 'asc' ? ' ↑' : ' ↓';
        }

        filterTasks();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('engineerFilter').value = '';
        filterTasks();
        showToast('Фильтры сброшены', 'info');
    }

    function assignEngineer(taskId, engineerId) {
        if (!engineerId) return;

        fetch(`/api/tasks/${taskId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                engineer_id: parseInt(engineerId)
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка ответа сервера');
            }
            return response.json();
        })
        .then(() => {
            showToast('✅ Инженер назначен', 'success');
            setTimeout(() => location.reload(), 1000);
        })
        .catch(() => {
            showToast('❌ Ошибка при назначении', 'error');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        filterTasks();
    });
</script>
{% endblock %}
